<!doctype html>
<html lang="en" data-mood="sunny" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No-flash mood initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-mood');
          if (saved && ['sunny', 'coral', 'mono', 'ink'].indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-mood', saved);
          } else {
            document.documentElement.setAttribute('data-mood', 'sunny');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts: Bricolage Grotesque, Hanken Grotesk, Spline Sans Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
